  PLAYER_NOT_FOUND: "&cPlayer '&f%player%&c' is not online."
  NOT_ENOUGH_KEYS: "&cYou don't have enough keys. (&f%amount% &cneeded)"
  INVENTORY_FULL: "&cYour inventory is full!"
  INVENTORY_PARTIAL: "&7Only &#6BF18D%amount% &7fit in your inventory - you were not charged for the other &#6BF18D%left%&7."
  REWARD_RECEIVED: "&7You bought &#6BF18D%amount%x %item% &7from &#6BF18D%crate%&7."
  NO_CRATE_FOUND: "&cCrate '&f%crate%&c' does not exist."
  CRATE_CREATED: "&7Successfully created the crate &7(&#6BF18D%crate%&7)"
