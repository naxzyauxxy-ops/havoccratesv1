# ==========================================================
#  HavocCrates
#
#  Crate menus keep the alignment from crates.yml: each crate
#  uses its own TITLE and ROWS, rewards with a POSITION land
#  on that slot and the rest are centered (7 rewards -> 10-16
#  of a 3 row menu, 5 -> 11-15, 2 -> 12-13).
#
#  Left click a reward  -> buy 1
#  Right click a reward -> buy a full stack (capped by your
#                          keys and by RESTRICTIONS)
#  Unstackable rewards (armour, tools) are handed over as
#  separate items, so a bulk buy fills your inventory.
# ==========================================================

DATABASE:
  # FLATFILE, SQLITE or MYSQL. Falls back to FLATFILE if the driver is missing.
  TYPE: "FLATFILE"
  MYSQL:
    HOST: "localhost"
    DATABASE: "havoc_crates"
    USER: "root"
    PASSWORD: "password"

CRATE-VIEW-MENU:
  # Only used when a crate has no TITLE of its own.
  TITLE: "%crate%"
  PLACEHOLDER: true
  PLACEHOLDER-MATERIAL: "GRAY_STAINED_GLASS_PANE"
  PLACEHOLDER-NAME: " "
  # Appended under each reward. Lines containing %stack% are hidden for single purchase items.
  ITEM-LORE:
    - ""
    - "&7Your keys: &f%keys%"
    - "&#00FC00▶ Left click &7to buy &f1"
    - "&#00FC00▶ Right click &7to buy &f%stack%"

CONFIRM-MENU:
  TITLE: "&8ᴄᴏɴꜰɪʀᴍ"
  SIZE: 27
  # Where the reward preview sits. Its stack size follows the amount you picked.
  ITEM-SLOT: 13
  # Hard ceiling for every purchase, before RESTRICTIONS are applied.
  MAX-AMOUNT: 64
  # true  -> anything that does not fit is dropped at your feet
  # false -> nothing is dropped: the inventory is filled with as many as fit and you are only
  #          charged for those (existing items are never replaced)
  DROP-OVERFLOW: true
  SOUND: "entity.player.levelup"
  ITEM-LORE:
    - ""
    - "&7Amount: &f%amount%"
    - "&7Cost: &f%cost% &7key(s)"
    - "&7Your keys: &f%keys%"
  FILLER:
    ENABLED: true
    MATERIAL: "GRAY_STAINED_GLASS_PANE"
    NAME: " "

  # Quantity buttons. A button's behaviour comes from its name:
  #   ADD_*    -> adds INCREMENT        SET_*   -> sets the amount
  #   REMOVE_* -> takes away DECREMENT  MAX_*   -> jumps to the highest allowed
  #   MIN_* / RESET_* -> back to the minimum
  # or set MODE: ADD / SUBTRACT / SET / MAX / MIN explicitly.
  # Shift clicking an add button jumps to the max, shift clicking a remove button resets to the min.
  QUANTITY_ADJUST:
    ADD:
      MATERIAL: "LIME_STAINED_GLASS_PANE"
      ADD_1:
        SLOT: 15
        NAME: "&#00FC00Add 1"
        INCREMENT: 1
      ADD_10:
        SLOT: 16
        NAME: "&#00FC00Add 10"
        INCREMENT: 10
      SET_64:
        SLOT: 17
        NAME: "&#00FC00Set to 64"
        INCREMENT: 64

    REMOVE:
      MATERIAL: "RED_STAINED_GLASS_PANE"
      REMOVE_1:
        SLOT: 11
        NAME: "&cRemove 1"
        DECREMENT: 1
      REMOVE_10:
        SLOT: 10
        NAME: "&cRemove 10"
        DECREMENT: 10
      REMOVE_64:
        SLOT: 9
        NAME: "&cRemove 64"
        DECREMENT: 64

  BUTTONS:
    CONFIRM:
      MATERIAL: "LIME_STAINED_GLASS_PANE"
      NAME: "&#00FC00ᴄᴏɴꜰɪʀᴍ"
      SLOT: 26
      LORE:
        - "&7Buy &f%amount%&7 for &f%cost% &7key(s)."
    CANCEL:
      MATERIAL: "RED_STAINED_GLASS_PANE"
      NAME: "&#FC0000ᴄᴀɴᴄᴇʟ"
      SLOT: 18
      LORE:
        - "&7Back to the crate."
    INFO:
      ENABLED: true
      MATERIAL: "TRIPWIRE_HOOK"
      NAME: "&eYour keys: &f%keys%"
      SLOT: 22
      LORE:
        - "&7Each item costs &f1 &7key."

# Per material purchase limits. A key matches the material exactly or as a suffix, so
# SHULKER_BOX also covers PINK_SHULKER_BOX. The most specific match wins, DEFAULT is the fallback.
# HIDE_QUANTITY_BUTTONS removes the green/red buttons entirely for that item.
RESTRICTIONS:
  TOTEM_OF_UNDYING:
    MAX_QUANTITY: 1
    MIN_QUANTITY: 1
    HIDE_QUANTITY_BUTTONS: true
  ENDER_PEARL:
    MAX_QUANTITY: 16
    MIN_QUANTITY: 1
  SHIELD:
    MAX_QUANTITY: 1
    MIN_QUANTITY: 1
    HIDE_QUANTITY_BUTTONS: true
  BOW:
    MAX_QUANTITY: 1
    MIN_QUANTITY: 1
    HIDE_QUANTITY_BUTTONS: true
  CROSSBOW:
    MAX_QUANTITY: 1
    MIN_QUANTITY: 1
    HIDE_QUANTITY_BUTTONS: true
  TRIDENT:
    MAX_QUANTITY: 1
    MIN_QUANTITY: 1
    HIDE_QUANTITY_BUTTONS: true
  SHULKER_BOX:
    MAX_QUANTITY: 1
    MIN_QUANTITY: 1
    HIDE_QUANTITY_BUTTONS: true
  SPLASH_POTION:
    MAX_QUANTITY: 1
    MIN_QUANTITY: 1
    HIDE_QUANTITY_BUTTONS: true
  POTION:
    MAX_QUANTITY: 1
    MIN_QUANTITY: 1
    HIDE_QUANTITY_BUTTONS: true
  ENCHANTED_BOOK:
    MAX_QUANTITY: 1
    MIN_QUANTITY: 1
    HIDE_QUANTITY_BUTTONS: true
  MUSHROOM_STEW:
    MAX_QUANTITY: 1
    MIN_QUANTITY: 1
    HIDE_QUANTITY_BUTTONS: true
  RABBIT_STEW:
    MAX_QUANTITY: 1
    MIN_QUANTITY: 1
    HIDE_QUANTITY_BUTTONS: true
  HONEY_BOTTLE:
    MAX_QUANTITY: 16
    MIN_QUANTITY: 1
  FLINT_AND_STEEL:
    MAX_QUANTITY: 1
    MIN_QUANTITY: 1
    HIDE_QUANTITY_BUTTONS: true
  SPAWNER:
    MAX_QUANTITY: 64
    MIN_QUANTITY: 1
  DEFAULT:
    MAX_QUANTITY: 64
    MIN_QUANTITY: 1

