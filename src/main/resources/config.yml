# ==========================================================
#  HavocCrates  ❄  ᴄʜʀɪꜱᴛᴍᴀꜱ ᴇᴅɪᴛɪᴏɴ  ❄
#
#  Crate menus keep the alignment from crates.yml: each crate
#  uses its own TITLE and ROWS, rewards with a POSITION land
#  on that slot and the rest are centered.
#
#  Left click a reward  -> unwrap 1
#  Right click a reward -> unwrap a full stack
# ==========================================================

DATABASE:
  # FLATFILE, SQLITE or MYSQL. Falls back to FLATFILE if the driver is missing.
  TYPE: "FLATFILE"
  MYSQL:
    HOST: "localhost"
    DATABASE: "havoc_crates"
    USER: "root"
    PASSWORD: "password"

CRATE-VIEW-MENU:
  # Only used when a crate has no TITLE of its own.
  TITLE: "&c❄ &a%crate% &c❄"
  PLACEHOLDER: true
  PLACEHOLDER-MATERIAL: "GREEN_STAINED_GLASS_PANE"
  PLACEHOLDER-NAME: " "
  ITEM-LORE:
    - ""
    - "&c✦ &aLeft click &7to buy &f%each%"
    - "&c✦ &aRight click &7to buy &f%items%"
    - ""
    - "&7Your keys&8: &c%keys%"

# Sounds are written as "sound", "sound|volume" or "sound|volume|pitch". "none" mutes one.
SOUNDS:
  # Sleigh bells on every button.
  BUTTON-CLICK: "minecraft:block.note_block.bell|0.7|1.6"
  PURCHASE: "minecraft:block.note_block.chime|1.0|1.4"
  ERROR: "minecraft:block.note_block.didgeridoo|0.8|0.6"

# Particle burst on a successful purchase: "PARTICLE", "PARTICLE|count" or "PARTICLE|count|spread".
EFFECTS:
  PURCHASE: "SNOWFLAKE|35|0.6"

ALERTS:
  DEFAULT: true
  STATUS-ENABLED: "&aON"
  STATUS-DISABLED: "&cOFF"
  TOGGLEABLE:
    - REWARD_RECEIVED
    - INVENTORY_PARTIAL
    - RECEIVED_KEYS
  ALWAYS-SHOW:
    - NOT_ENOUGH_KEYS
    - INVENTORY_FULL
    - NO_PERMISSION
    - PLAYERS_ONLY
    - PLAYER_NOT_FOUND
    - NO_CRATE_FOUND
    - NO_CRATES_FOUND
    - CRATE_PROTECTED
    - ALERTS_ENABLED
    - ALERTS_DISABLED

CRATE-COMMAND:
  SOUND: "minecraft:block.note_block.bell|0.8|1.2"
  PER-CRATE-PERMISSION: false
  REQUIRE-KEYS: false

# ==========================================================
#  ❄  ʜᴏʟᴏɢʀᴀᴍꜱ  ❄
#  Floating text above every crate block, drawn with
#  invisible armour stands - no hologram plugin needed.
#  %crate% = crate name, %crate_upper% = CRATE NAME,
#  %rewards% = how many rewards it holds.
# ==========================================================
HOLOGRAMS:
  ENABLED: true
  # Height of the first line above the crate block.
  HEIGHT: 2.8
  # Gap between lines.
  LINE-SPACING: 0.28
  # Puts holograms back after a chunk reload.
  REFRESH-SECONDS: 30
  # Used by every crate that has no override below.
  LINES:
    - "&c&l❄ &a&l%crate_upper% CRATE &c&l❄"
    - "&8► &7Obtain @ &f/store &8◄"
    - "&a► &7Right click to &aOpen &a◄"
    - "&f❅ &7Merry Christmas! &f❅"
  # Per crate text. The section name must match the crate name in crates.yml.
  CRATES:
    Christmas:
      LINES:
        - "&c&l❄ &a&lCHRISTMAS CRATE &c&l❄"
        - "&8► &7Obtain @ &f/store &8◄"
        - "&c► &7Right click to &cUnwrap &c◄"
        - "&f❅ &7One key, one random gift &f❅"

# ==========================================================
#  ❄  ᴍʏꜱᴛᴇʀʏ ᴘʀᴇꜱᴇɴᴛ  ❄
#  A present sits in every crate menu. One key opens it and
#  hands out ONE random reward from that crate.
#
#  Odds live in crates.yml under each crate's CHANCES, keyed
#  by the same reward key as REWARDS:
#
#    Gold:
#      CHANCES:
#        '10': 50     # weight, not a percentage
#        '11': 25
#        '12': 25
#
#  A reward with no CHANCES entry weighs 1, so a crate with
#  no CHANCES at all rolls every reward evenly. The lore's
#  %chances% line turns the weights into percentages.
# ==========================================================
PRESENT:
  ENABLED: true
  MATERIAL: "RED_SHULKER_BOX"
  NAME: "&c❄ &aᴍʏꜱᴛᴇʀʏ ᴘʀᴇꜱᴇɴᴛ &c❄"
  # -1 = auto: centered on the first row that has no rewards in it.
  SLOT: -1
  # Only these crates get a present - everything else stays a normal crate.
  # Use the crate names exactly as they appear in crates.yml (Common, Gold, Ruby, God, Rare, Loot).
  # Put "ALL" here instead to give every crate a present.
  CRATES:
    - "Christmas"
  # Most presents that can be opened at once.
  MAX-AMOUNT: 64
  # true -> the crate's own rewards are NOT shown in the menu, only the present, so nobody can
  #         pick the item they want instead of rolling for it. The present is centered.
  # false -> the rewards are shown next to the present as usual.
  HIDE-REWARDS: true
  # Show the odds in the lore where %chances% sits.
  SHOW-CHANCES: true
  CHANCE-LINE: "&8 ▪ &f%item% &8» &a%chance%%"
  CONFIRM-TITLE: "&c❄ &aᴏᴘᴇɴ ʏᴏᴜʀ ᴘʀᴇꜱᴇɴᴛꜱ &c❄"
  SOUND: "minecraft:block.note_block.chime|1.0|1.6"
  # How each rolled gift is listed in the chat summary.
  REWARD-ENTRY: "&a%amount%x %item%"
  REWARD-SEPARATOR: "&7, "
  # The confirm button while opening presents. Delete this block to reuse the normal one.
  CONFIRM-BUTTON:
    MATERIAL: "LIME_STAINED_GLASS_PANE"
    NAME: "&a&lᴜɴᴡʀᴀᴘ ɢɪꜰᴛ"
    LORE:
      - ""
      - "&7Unwrap &f%amount%&7 present(s) for &c%cost% &7key(s)."
      - ""
  LORE:
    - ""
    - "&7One key &8» &7one random gift."
    - ""
    - "&a❅ &7Inside this present&8:"
    - "%chances%"
    - ""
    - "&c✦ &aLeft click &7to open &f1"
    - "&c✦ &aRight click &7to open &f%stack%"
    - ""
    - "&7Your keys&8: &c%keys%"

CONFIRM-MENU:
  TITLE: "&c❄ &aᴄᴏɴꜰɪʀᴍ ʏᴏᴜʀ ɢɪꜰᴛ &c❄"
  SIZE: 54
  ITEM-SLOT: 22
  MAX-AMOUNT: 64
  RESTRICTIONS-IN-ITEMS: true
  COMMANDS-REPLACE-ITEM: true
  HIDE-UNUSABLE-BUTTONS: true
  DROP-OVERFLOW: false
  SOUND: "minecraft:block.note_block.chime|1.0|1.4"
  ITEM-LORE:
    - ""
    - "&c❅ &7Amount &8» &f%amount%"
    - "&a❅ &7You get &8» &f%items% &7(&f%each% &7each)"
    - "&c❅ &7Cost &8» &c%cost% &7key(s)"
    - "&a❅ &7You have &8» &c%keys% &7key(s)"
    - ""
  # Snowy background.
  FILLER:
    ENABLED: true
    MATERIAL: "WHITE_STAINED_GLASS_PANE"
    NAME: " "
  # Candy cane frame: MATERIALS cycles around the border (needs v4.0+).
  # On older versions only MATERIAL is used.
  BORDER:
    ENABLED: true
    MATERIAL: "RED_STAINED_GLASS_PANE"
    MATERIALS:
      - "RED_STAINED_GLASS_PANE"
      - "WHITE_STAINED_GLASS_PANE"
      - "GREEN_STAINED_GLASS_PANE"
      - "WHITE_STAINED_GLASS_PANE"
    NAME: " "

  QUANTITY_ADJUST:
    ADD:
      MATERIAL: "LIME_STAINED_GLASS_PANE"
      LORE:
        - "&7Selected &8» &f%amount%&7/&f%max%"
      ADD_1:
        SLOT: 23
        NAME: "&a❅ Add 1"
        INCREMENT: 1
      ADD_10:
        SLOT: 24
        NAME: "&a❅ Add 10"
        INCREMENT: 10
      SET_64:
        SLOT: 25
        NAME: "&a❅ Set to 64"
        INCREMENT: 64

    REMOVE:
      MATERIAL: "RED_STAINED_GLASS_PANE"
      LORE:
        - "&7Selected &8» &f%amount%&7/&f%max%"
      REMOVE_1:
        SLOT: 21
        NAME: "&c❆ Remove 1"
        DECREMENT: 1
      REMOVE_10:
        SLOT: 20
        NAME: "&c❆ Remove 10"
        DECREMENT: 10
      REMOVE_64:
        SLOT: 19
        NAME: "&c❆ Remove 64"
        DECREMENT: 64

  BUTTONS:
    CONFIRM:
      MATERIAL: "LIME_STAINED_GLASS_PANE"
      NAME: "&a&lᴄᴏɴꜰɪʀᴍ"
      SLOTS: [41]
      LORE:
        - ""
        - "&7Buy &f%amount%&7 for &c%cost% &7key(s)."
        - ""
    CANCEL:
      MATERIAL: "RED_STAINED_GLASS_PANE"
      NAME: "&c&lᴄᴀɴᴄᴇʟ"
      SLOTS: [39]
      LORE:
        - ""
        - "&7Back to the crate."
        - ""
    INFO:
      ENABLED: false
      MATERIAL: "BELL"
      NAME: "&c❄ &7Your keys&8: &f%keys%"
      SLOT: 13
      LORE:
        - ""
        - "&8▪ &7Each gift costs &c1 &7key."
        - "&8▪ &7Unwrapping &f%amount%&7 costs &c%cost%&7."
        - ""

