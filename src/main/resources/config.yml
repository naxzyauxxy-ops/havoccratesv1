  PLAYERS_ONLY: "&cOnly players can use this."
  PLAYER_NOT_FOUND: "&cPlayer &#FF5555%player%&c is not online."
  NOT_ENOUGH_KEYS: "&cYou don't have enough keys. &8(&#FF5555%amount% &cneeded&8)"
  INVENTORY_FULL: "&cYour inventory is full!"
  INVENTORY_PARTIAL: "&cOnly &#FF5555%amount%&c fit in your inventory - you were not charged for the other &#FF5555%left%&c."
  REWARD_RECEIVED: "&cYou bought &#FF5555%amount%x %item% &cfrom &#FF5555%crate%&c."
  NO_CRATE_FOUND: "&cCrate &#FF5555%crate%&c does not exist."
  CRATE_CREATED: "&cCreated the crate &#FF5555%crate%&c."
  CRATE_DELETED: "&cDeleted the crate &#FF5555%crate%&c."
  CRATE_SAVED: "&cSaved the rewards of &#FF5555%crate%&c."
