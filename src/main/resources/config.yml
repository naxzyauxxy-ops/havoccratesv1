# ==========================================================
#  HavocCrates
#
#  Crate menus keep the alignment from crates.yml: each crate
#  uses its own TITLE and ROWS, rewards with a POSITION land
#  on that slot and the rest are centered (7 rewards -> 10-16
#  of a 3 row menu, 5 -> 11-15, 2 -> 12-13).
#
#  Left click a reward  -> buy 1
#  Right click a reward -> buy a full stack (capped by your
#                          keys and by RESTRICTIONS)
#  Unstackable rewards (armour, tools) are handed over as
#  separate items, so a bulk buy fills your inventory.
# ==========================================================

DATABASE:
  # FLATFILE, SQLITE or MYSQL. Falls back to FLATFILE if the driver is missing.
  TYPE: "FLATFILE"
  MYSQL:
    HOST: "localhost"
    DATABASE: "havoc_crates"
    USER: "root"
    PASSWORD: "password"

CRATE-VIEW-MENU:
  # Only used when a crate has no TITLE of its own.
  TITLE: "%crate%"
  PLACEHOLDER: true
  PLACEHOLDER-MATERIAL: "GRAY_STAINED_GLASS_PANE"
  PLACEHOLDER-NAME: " "
  # Appended under each reward. Lines containing %stack% are hidden for single purchase items.
  ITEM-LORE:
    - ""
    - "&#FF5555▶ &cLeft click &7to buy &f%each%"
    - "&#FF5555▶ &cRight click &7to buy &f%items%"
    - ""
    - "&7Your keys: &c%keys%"

# Players can silence the crate messages with /cratealerts (aliases: /togglecratealerts,
# /cratemessages). Only the messages listed under TOGGLEABLE are affected - errors such as
# NOT_ENOUGH_KEYS and INVENTORY_FULL always come through.
#
# Placeholders for a settings menu or scoreboard:
#   %havoccrates_alerts_status%  -> Enabled / Disabled (the two strings below)
#   %havoccrates_alerts%         -> true / false
ALERTS:
  # Default for a player who has never touched the setting.
  DEFAULT: true
  STATUS-ENABLED: "&aEnabled"
  STATUS-DISABLED: "&cDisabled"
  TOGGLEABLE:
    - REWARD_RECEIVED
    - INVENTORY_PARTIAL
    - RECEIVED_KEYS

# /crate [crate] opens a crate menu from anywhere in the world.
#   /crate                -> lists the crates and your key count for each
#   /crate Rare           -> opens the Rare crate
#   /crate Rare <player>  -> opens it for someone else (needs havoccrates.admin)
CRATE-COMMAND:
  SOUND: "block.chest.open"
  # true -> a player also needs havoccrates.crate.<crate> for that specific crate
  PER-CRATE-PERMISSION: false
  # true -> the menu only opens when the player holds at least one key for that crate
  REQUIRE-KEYS: false

CONFIRM-MENU:
  TITLE: "&8ᴄᴏɴꜰɪʀᴍ ʏᴏᴜʀ ᴘᴜʀᴄʜᴀꜱᴇ"
  # 54 = six rows. The layout below is built for it:
  #
  #   row 1                    your keys (13)
  #   row 2   -64 -10 -1 (19-21)   ITEM (22)   +1 +10 set 64 (23-25)
  #   row 4      CANCEL (37-39)              CONFIRM (41-43)
  #
  SIZE: 54
  # Where the reward preview sits. Its stack size follows the amount you picked.
  ITEM-SLOT: 22
  # Hard ceiling for every purchase, before RESTRICTIONS are applied.
  MAX-AMOUNT: 64
  # A reward saved in crates.yml with a stack size (Gold = 16 spawners, Loot = 64 blocks) hands
  # over that whole stack for one key.
  #   true  -> MAX_QUANTITY below counts ITEMS, so SPAWNER: 16 with a 16 spawner reward = 1 buy
  #   false -> MAX_QUANTITY counts purchases, so SPAWNER: 16 would allow 16 x 16 = 256 spawners
  RESTRICTIONS-IN-ITEMS: true
  # Hides a quantity button when clicking it would not change anything, so "Remove 64" only shows
  # once you are above 64 and "Add 10" disappears at the limit. Set to false to always show them.
  HIDE-UNUSABLE-BUTTONS: true
  # true  -> anything that does not fit is dropped at your feet
  # false -> nothing is dropped: the inventory is filled with as many as fit and you are only
  #          charged for those (existing items are never replaced)
  DROP-OVERFLOW: true
  SOUND: "entity.player.levelup"
  ITEM-LORE:
    - ""
    - "&8▪ &7Amount &8» &f%amount%"
    - "&8▪ &7You get &8» &f%items% &7(&f%each% &7each)"
    - "&8▪ &7Cost &8» &c%cost% &7key(s)"
    - "&8▪ &7You have &8» &c%keys% &7key(s)"
    - ""
  # Background of the menu.
  FILLER:
    ENABLED: true
    MATERIAL: "BLACK_STAINED_GLASS_PANE"
    NAME: " "
  # Frame around the edges.
  BORDER:
    ENABLED: true
    MATERIAL: "GRAY_STAINED_GLASS_PANE"
    NAME: " "

  # Quantity buttons. A button's behaviour comes from its name:
  #   ADD_*    -> adds INCREMENT        SET_*   -> sets the amount
  #   REMOVE_* -> takes away DECREMENT  MAX_*   -> jumps to the highest allowed
  #   MIN_* / RESET_* -> back to the minimum
  # or set MODE: ADD / SUBTRACT / SET / MAX / MIN explicitly.
  # Shift clicking an add button jumps to the max, shift clicking a remove button resets to the min.
  QUANTITY_ADJUST:
    ADD:
      MATERIAL: "LIME_STAINED_GLASS_PANE"
      LORE:
        - "&7Selected &8» &f%amount%&7/&f%max%"
      ADD_1:
        SLOT: 23
        NAME: "&#00FC00Add 1"
        INCREMENT: 1
      ADD_10:
        SLOT: 24
        NAME: "&#00FC00Add 10"
        INCREMENT: 10
      SET_64:
        SLOT: 25
        NAME: "&#00FC00Set to 64"
        INCREMENT: 64

    REMOVE:
      MATERIAL: "RED_STAINED_GLASS_PANE"
      LORE:
        - "&7Selected &8» &f%amount%&7/&f%max%"
      REMOVE_1:
        SLOT: 21
        NAME: "&cRemove 1"
        DECREMENT: 1
      REMOVE_10:
        SLOT: 20
        NAME: "&cRemove 10"
        DECREMENT: 10
      REMOVE_64:
        SLOT: 19
        NAME: "&cRemove 64"
        DECREMENT: 64

  BUTTONS:
    # SLOTS makes a button a wide block; SLOT still works for a single square.
    CONFIRM:
      MATERIAL: "LIME_STAINED_GLASS_PANE"
      NAME: "&#00FC00ᴄᴏɴꜰɪʀᴍ"
      SLOTS: [41, 42, 43]
      LORE:
        - ""
        - "&7Buy &f%amount%&7 for &c%cost% &7key(s)."
        - ""
    CANCEL:
      MATERIAL: "RED_STAINED_GLASS_PANE"
      NAME: "&#FC0000ᴄᴀɴᴄᴇʟ"
      SLOTS: [37, 38, 39]
      LORE:
        - ""
        - "&7Back to the crate."
        - ""
    INFO:
      ENABLED: true
      MATERIAL: "TRIPWIRE_HOOK"
      NAME: "&cYour keys&8: &f%keys%"
      SLOT: 13
      LORE:
        - ""
        - "&8▪ &7Each item costs &c1 &7key."
        - "&8▪ &7Buying &f%amount%&7 costs &c%cost%&7."
        - ""

# Per material purchase limits. A key matches the material exactly, as a word suffix
# (SHULKER_BOX -> WHITE_SHULKER_BOX) or as a plain suffix (BOW -> CROSSBOW, AXE -> PICKAXE).
# The most specific match wins, DEFAULT is the fallback.
# HIDE_QUANTITY_BUTTONS removes the green/red buttons entirely for that item.
#
# With RESTRICTIONS-IN-ITEMS: true (default) MAX_QUANTITY counts items, so a reward saved as
# 16 spawners with SPAWNER: 16 is exactly one purchase that hands over all 16.
#
# MAX_PURCHASES overrides that maths when you want both: how much comes per key is the stack size
# in crates.yml, and MAX_PURCHASES is how many times it can be bought at once. For example
#   SPAWNER:  { MAX_QUANTITY: 16, MIN_QUANTITY: 1 }                -> 1 buy  = 16 spawners
#   DIAMOND_BLOCK: { MAX_PURCHASES: 10 }                           -> 10 buys = 10 x 64 blocks
RESTRICTIONS:

  # --- Economy-sensitive: deliberately below stack size ---
  SPAWNER:
    MAX_QUANTITY: 16
    MIN_QUANTITY: 1

  # --- Armor (stack size 1) ---
  HELMET: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  CHESTPLATE: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  LEGGINGS: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  BOOTS: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  HORSE_ARMOR: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  ELYTRA: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  SHIELD: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  TOTEM_OF_UNDYING: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }

  # --- Tools & weapons (stack size 1) ---
  SWORD: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  AXE: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  PICKAXE: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  SHOVEL: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  HOE: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  MACE: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  TRIDENT: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  BOW: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  FISHING_ROD: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  FLINT_AND_STEEL: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  SHEARS: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  SPYGLASS: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  BRUSH: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  ON_A_STICK: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }

  # --- Consumables & containers (stack size 1) ---
  POTION: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  SHULKER_BOX: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  ENCHANTED_BOOK: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  WRITABLE_BOOK: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  MUSHROOM_STEW: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  RABBIT_STEW: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  BEETROOT_SOUP: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  SUSPICIOUS_STEW: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  CAKE: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  BUNDLE: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  GOAT_HORN: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }

  # --- Transport & misc (stack size 1) ---
  MINECART: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  BOAT: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  RAFT: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  BED: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  SADDLE: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  MILK_BUCKET: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  WATER_BUCKET: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  LAVA_BUCKET: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }
  POWDER_SNOW_BUCKET: { MAX_QUANTITY: 1, MIN_QUANTITY: 1, HIDE_QUANTITY_BUTTONS: true }

  # --- Stack size 16 ---
  ENDER_PEARL: { MAX_QUANTITY: 16, MIN_QUANTITY: 1 }
  ENDER_EYE: { MAX_QUANTITY: 16, MIN_QUANTITY: 1 }
  HONEY_BOTTLE: { MAX_QUANTITY: 16, MIN_QUANTITY: 1 }
  SNOWBALL: { MAX_QUANTITY: 16, MIN_QUANTITY: 1 }
  EGG: { MAX_QUANTITY: 16, MIN_QUANTITY: 1 }
  SPAWN_EGG: { MAX_QUANTITY: 64, MIN_QUANTITY: 1 }
  BUCKET: { MAX_QUANTITY: 16, MIN_QUANTITY: 1 }
  SIGN: { MAX_QUANTITY: 16, MIN_QUANTITY: 1 }
  BANNER: { MAX_QUANTITY: 16, MIN_QUANTITY: 1 }
  ARMOR_STAND: { MAX_QUANTITY: 16, MIN_QUANTITY: 1 }
  WRITTEN_BOOK: { MAX_QUANTITY: 16, MIN_QUANTITY: 1 }

  DEFAULT:
    MAX_QUANTITY: 64
    MIN_QUANTITY: 1
    # Uncomment to let any unlisted reward be bought several times over
    # (a 64 block reward would then be up to 10 x 64 blocks):
    # MAX_PURCHASES: 10

