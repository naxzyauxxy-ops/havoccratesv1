  RECEIVED_KEYS: "&cYou have received &#FF5555%amount%&c key(s) for the crate &#FF5555%crate%&c."
  GIVEN_KEYS: "&cGave &#FF5555%amount%&c key(s) for the crate &#FF5555%crate%&c to &#FF5555%player%&c."
  KEYALL_GIVEN: "&cGave &#FF5555%amount%&c key(s) for the crate &#FF5555%crate%&c to every online player."
  KEYS_REMOVED_ADMIN: "&cRemoved &#FF5555%amount%&c key(s) for the crate &#FF5555%crate%&c from &#FF5555%player%&c."
  KEYS_SET: "&cSet the &#FF5555%crate%&c keys of &#FF5555%player%&c to &#FF5555%amount%&c."
  CRATE_ALREADY_EXISTS: "&cCrate &#FF5555%crate%&c already exists."
  CRATE_SET: "&cThis block is now the crate &#FF5555%crate%&c."
  CRATE_UNSET: "&cThis block is no longer the crate &#FF5555%crate%&c."
  CRATE_PROTECTED: "&cThis block belongs to the crate &#FF5555%crate%&c."
  NO_CRATES_FOUND: "&cNo crates found."
  CONFIG_RELOADED: "&cCrates configuration reloaded."
