name: HavocCrates
main: net.havoc.crates.CratesPlugin
version: ${project.version}
api-version: '1.20'
author: Havoc
description: Donut style crates with bulk buying, stackable armour rewards and a 1/10/64 amount selector.
softdepend:
  - PlaceholderAPI

commands:
  crates:
    description: Manage crates.
    usage: /crates
    aliases: [hcrates, havoccrates, cratesadmin]
    permission: havoccrates.admin
  crate:
    description: Open a crate menu from anywhere.
    usage: /crate [crate]
    aliases: [opencrate, crateopen]
    permission: havoccrates.crate
  cratealerts:
    description: Turn the crate messages on or off for yourself.
    usage: /cratealerts [on|off]
    aliases: [togglecratealerts, cratemessages, togglecratemessages, cratealert]
    permission: havoccrates.alerts
  key:
    description: Manage crate keys.
    usage: /key
    aliases: [keys, hkey]

permissions:
  havoccrates.admin:
    description: Full access to crate administration.
    default: op
  havoccrates.crate:
    description: Use /crate to open a crate menu from anywhere.
    default: true
  havoccrates.alerts:
    description: Use /cratealerts to silence or restore the crate messages.
    default: true
