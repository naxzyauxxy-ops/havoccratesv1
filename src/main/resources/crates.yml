# Crates live at the top level of this file, exactly like the old plugin wrote them:
#
# Common:
#   TITLE: '&8ᴄʜᴏᴏsᴇ 1 ɪᴛᴇᴍ'
#   ROWS: 3
#   LOCATIONS:
#   - world,99,-21,70          # world,x,y,z  (world;x;y;z also works)
#   COMMANDS:
#     '10': 'voyager amethyst pickaxe {player} 7d'   # {player} {crate} {amount} are replaced.
#     '11': ''                                       # A command with {amount} runs once with the
#                                                    # total, otherwise it runs once per item.
#   POSITIONS:
#     '10': -1                 # -1 = auto centered, or a slot number to pin it
#   REWARDS:
#     '10':
#       ==: org.bukkit.inventory.ItemStack
#       ...
#
# /crates edit <crate> writes this file for you.
#
# Mystery present odds (optional). Weights, not percentages - a reward with no
# entry weighs 1, so leaving CHANCES out entirely makes every reward equally likely:
#
#   Gold:
#     CHANCES:
#       '10': 50
#       '11': 25
#       '12': 25
