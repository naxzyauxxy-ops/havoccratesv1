# Settings dialog with the HavocCrates toggle added under Notifications.
# The new line is:
#   - LABEL: "  Crate Alerts: %havoccrates_alerts_status%"
#     COMMAND: "cratealerts"
# %havoccrates_alerts_status% renders as ON / OFF (configurable in HavocCrates config.yml
# under ALERTS.STATUS-ENABLED / ALERTS.STATUS-DISABLED).

SETTINGS_DIALOG:
  TITLE: "Settings"
  EXTERNAL-TITLE: "Settings"
  ITEM: "COMPARATOR"
  COLUMNS: 1
  BUTTON-WIDTH: 220
  CATEGORIES:
    - ID: "chat"
      LABEL: "Chat"
      BUTTONS:
        - LABEL: "  Public Chat: %economy_setting_publicchat%"
          ACTION: "economy:toggle_publicchat"
        - LABEL: "  Private Messages: %economy_setting_privatemessages%"
          ACTION: "economy:toggle_privatemessages"
        - LABEL: "  Server Messages: %economy_setting_servermessages%"
          ACTION: "economy:toggle_servermessages"
        - LABEL: "  Death Messages: %economy_setting_deathmessages%"
          ACTION: "economy:toggle_deathmessages"
        - LABEL: "  Advancement Messages: %economy_setting_advancementmessages%"
          ACTION: "economy:toggle_advancementmessages"
        - LABEL: "  Join/Leave Messages: %economy_setting_joinleavemessages%"
          ACTION: "economy:toggle_joinleavemessages"
        - LABEL: "  Hotbar Messages: %economy_setting_hotbarmessages%"
          ACTION: "economy:toggle_hotbarmessages"
        - LABEL: "  Team Chat: %economy_setting_teamchat%"
          ACTION: "economy:toggle_teamchat"
    - ID: "notifications"
      LABEL: "Notifications"
      BUTTONS:
        - LABEL: "  Pay Alerts: %economy_setting_payalerts%"
          ACTION: "economy:toggle_payalerts"
        - LABEL: "  Teleport Alerts: %economy_setting_tpaalerts%"
          ACTION: "economy:toggle_tpaalerts"
        - LABEL: "  Bounty Alerts: %economy_setting_bountyalerts%"
          ACTION: "economy:toggle_bountyalerts"
        - LABEL: "  Auction Alerts: %donutauction_alerts_status%"
          COMMAND: "toggleauctionalerts"
        - LABEL: "  Orders Alerts: %donutorders_alerts_status%"
          COMMAND: "toggleorderalerts"
        - LABEL: "  Crate Alerts: %havoccrates_alerts_status%"
          COMMAND: "cratealerts"
        - LABEL: "  Server Sounds: %economy_setting_serversounds%"
          ACTION: "economy:toggle_serversounds"
        - LABEL: "  Follow Alerts: %economy_setting_followalerts%"
          ACTION: "economy:toggle_followalerts"
    - ID: "pvp"
      LABEL: "PvP"
      BUTTONS:
        - LABEL: "  Fast Crystals: %economy_setting_fastcrystals%"
          ACTION: "economy:toggle_fastcrystals"
        - LABEL: "  Totem Particles: %economy_setting_totemparticles%"
          ACTION: "economy:toggle_totemparticles"
        - LABEL: "  Explosion Particles: %economy_setting_explosionparticles%"
          ACTION: "economy:toggle_explosionparticles"
        - LABEL: "  Explosion Sounds: %economy_setting_explosionsounds%"
          ACTION: "economy:toggle_explosionsounds"
        - LABEL: "  Destroy Pearl On Death: %economy_setting_destroypearlondeath%"
          ACTION: "economy:toggle_destroypearlondeath"
    - ID: "visuals"
      LABEL: "Visuals"
      BUTTONS:
        - LABEL: "  Night Vision: %economy_setting_nightvision%"
          ACTION: "economy:toggle_nightvision"
        - LABEL: "  Worth Display: %economy_setting_worthdisplay%"
          ACTION: "economy:toggle_worthdisplay"
        - LABEL: "  Teleport Confirm Menus: %economy_setting_tpaconfirm%"
          ACTION: "economy:toggle_tpaconfirm"
    - ID: "privacy"
      LABEL: "Privacy"
      BUTTONS:
        - LABEL: "  Teleport Requests: %economy_setting_tparequests%"
          ACTION: "economy:toggle_tparequests"
        - LABEL: "  Teleport-Here Requests: %economy_setting_tpahere%"
          ACTION: "economy:toggle_tpahere"
        - LABEL: "  Allow Payments: %economy_setting_payments%"
          ACTION: "economy:toggle_payments"
        - LABEL: "  Team Invites: %economy_setting_teaminvites%"
          ACTION: "economy:toggle_teaminvites"
    - ID: "scoreboard"
      LABEL: "Scoreboard"
      BUTTONS:
        - LABEL: "  Scoreboard: %economy_setting_scoreboard%"
          ACTION: "economy:toggle_scoreboard"
        - LABEL: "  Show Money: %economy_setting_showmoney%"
          ACTION: "economy:toggle_showmoney"
        - LABEL: "  Show Rubies: %economy_setting_showshards%"
          ACTION: "economy:toggle_showshards"
        - LABEL: "  Show Playtime: %economy_setting_showplaytime%"
          ACTION: "economy:toggle_showplaytime"
    - ID: "general"
      LABEL: "General"
      BUTTONS:
        - LABEL: "  Pay Confirm Menus: %economy_setting_payconfirm%"
          ACTION: "economy:toggle_payconfirm"
        - LABEL: "  TP Auto: %economy_setting_tpauto%"
          ACTION: "economy:toggle_tpauto"
        - LABEL: "  Disable Mob Spawn: %economy_setting_disablemobspawn%"
          ACTION: "economy:toggle_disablemobspawn"
        - LABEL: "  Disable Phantom Spawn: %economy_setting_disablephantom%"
          ACTION: "economy:toggle_disablephantom"
        - LABEL: "  Lunar Teammates: %economy_setting_lunarteammates%"
          ACTION: "economy:toggle_lunarteammates"
        - LABEL: "  Fast Auction: %donutauction_fastAuction%"
          COMMAND: "togglefastauction"
        - LABEL: "  Include Shulker on /sell: %economy_setting_sellshulkers%"
          ACTION: "economy:toggle_sellshulkers"
